      import heapq
      def kth_largest(nums, k):
          return heapq.nlargest(k, nums)[-1]

  - id: evaluate_rpn
    title: Evaluate reverse Polish notation
    difficulty: hard
    function: eval_rpn
    signature: "def eval_rpn(tokens: list[str]) -> int"
    statement: "Evaluate an expression in reverse Polish notation with integer tokens and the operators + - * /. Division truncates toward zero."
    tests:
      - {args: [["2", "1", "+", "3", "*"]], expected: 9}
      - {args: [["4", "13", "5", "/", "+"]], expected: 6}
      - {args: [["10", "6", "9", "3", "+", "-11", "*", "/", "*", "17", "+", "5", "+"]], expected: 22}
      - {args: [["-7", "2", "/"]], expected: -3}
    reference: |
      def eval_rpn(tokens):
          st = []
          for t in tokens:
              if t in "+-*/" and len(t) == 1:
                  b, a = st.pop(), st.pop()
                  if t == "+":
                      st.append(a + b)
                  elif t == "-":
                      st.append(a - b)
                  elif t == "*":
                      st.append(a * b)
                  else:
                      st.append(int(a / b))
              else:
                  st.append(int(t))
          return st[0]

  - id: longest_palindromic_substring
    title: Longest palindromic substring
    difficulty: hard
    function: longest_palindrome
    signature: "def longest_palindrome(s: str) -> str"
    statement: "Return the longest substring of s that is a palindrome. If several have the maximum length, return the leftmost one."
    tests:
      - {args: ["babad"], expected: "bab"}
      - {args: ["cbbd"], expected: "bb"}
      - {args: ["a"], expected: "a"}
      - {args: ["forgeeksskeegfor"], expected: "geeksskeeg"}
    reference: |
      def longest_palindrome(s):
          best = ""
          for i in range(len(s)):
              for l, r in ((i, i), (i, i + 1)):
                  while l >= 0 and r < len(s) and s[l] == s[r]:
                      l -= 1
                      r += 1
                  if r - l - 1 > len(best):
                      best = s[l + 1:r]
          return best
