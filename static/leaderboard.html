<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Arena — Ranking</title>
  <link rel="stylesheet" href="/css/arena.css">
</head>
<body>
<main class="page">
  <header class="topbar">
    <h1 class="logo"><a href="/">LLM Arena</a></h1>
    <div class="topbar-right"><a href="/">← Voltar para a arena</a></div>
  </header>

  <h2>Ranking</h2>
  <div class="table-wrap">
    <table id="lb-table">
      <thead>
        <tr>
          <th class="num">#</th>
          <th>Modelo</th>
          <th>Provedor</th>
          <th class="num">Lutas</th>
          <th class="num">V/E/D</th>
          <th class="num">Vitórias</th>
          <th class="num">Acertos/Golpes</th>
          <th class="num">Precisão</th>
          <th class="num">Tempo médio</th>
          <th class="num">Dano total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <p id="lb-empty" class="empty-msg"></p>

  <h2>Últimas lutas</h2>
  <ul id="matches-list" class="matches"></ul>
</main>
<script type="module" src="/js/leaderboard.js"></script>
</body>
</html>
