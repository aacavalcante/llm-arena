services:
  arena:
    build: .
    container_name: llm-arena
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    # Exposto no IP público da VPS (decisão do Alisson): qualquer pessoa com o IP pode iniciar lutas
    # e gastar tokens das chaves do .env. Troque para "127.0.0.1:8080:8080" para voltar a só local.
    ports:
      - "80:8080"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
